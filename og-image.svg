<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#151a3a"/>
      <stop offset="100%" stop-color="#1c2348"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#AF52DE"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <style>
      .heading { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang TC", "Hiragino Sans", "Noto Sans CJK TC", sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow blobs -->
  <circle cx="100" cy="100" r="180" fill="#5AC8FA" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1100" cy="550" r="220" fill="#AF52DE" opacity="0.18" filter="url(#glow)"/>

  <!-- LEFT SIDE: Brand and tagline -->
  <g>
    <!-- App logo placeholder -->
    <rect x="80" y="100" width="64" height="64" rx="14" fill="url(#accent)"/>
    <text x="112" y="148" class="heading" font-size="38" font-weight="800" fill="white" text-anchor="middle">V</text>

    <!-- App name -->
    <text x="80" y="260" class="heading" font-size="100" font-weight="800" fill="white" letter-spacing="-2">VNC Pad</text>

    <!-- Subtitle -->
    <text x="82" y="305" class="heading" font-size="28" font-weight="500" fill="#8E92BC">Remote Desktop for iPad</text>

    <!-- Main tagline -->
    <text x="80" y="400" class="heading" font-size="34" font-weight="600" fill="white">Where your input method</text>
    <text x="80" y="445" class="heading" font-size="34" font-weight="700" fill="url(#accent)">just works.</text>

    <!-- Feature bullets -->
    <g class="heading" font-size="18" fill="#A5A9C8">
      <text x="80" y="520">✓  Native CJK input methods (注音 · 拼音 · 日本語 · 한글)</text>
      <text x="80" y="548">✓  Metal-accelerated · 232+ key mappings · No cloud account</text>
    </g>

    <!-- App Store pill -->
    <g transform="translate(80, 575)">
      <rect width="200" height="36" rx="18" fill="white"/>
      <text x="100" y="24" class="heading" font-size="15" font-weight="700" fill="#0a0e27" text-anchor="middle">Download · $9.99</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Visual showing IME working -->
  <g transform="translate(660, 90)">
    <!-- iPad-like device frame -->
    <rect x="0" y="0" width="480" height="450" rx="32" fill="#2a2a2c" stroke="#444" stroke-width="1.5"/>

    <!-- Screen -->
    <rect x="18" y="18" width="444" height="414" rx="14" fill="url(#screen)"/>

    <!-- Title bar -->
    <rect x="18" y="18" width="444" height="34" rx="14" fill="#3a3a3c"/>
    <rect x="18" y="42" width="444" height="10" fill="#3a3a3c"/>
    <circle cx="38" cy="35" r="6" fill="#FF5F57"/>
    <circle cx="58" cy="35" r="6" fill="#FEBC2E"/>
    <circle cx="78" cy="35" r="6" fill="#28C840"/>
    <text x="240" y="40" class="heading" font-size="13" font-weight="600" fill="#8E8E93" text-anchor="middle">MacBook Pro — Screen Sharing</text>

    <!-- Mac content area -->
    <rect x="40" y="80" width="400" height="320" rx="8" fill="#1c1c1e"/>

    <!-- Mock typed Chinese -->
    <text x="60" y="135" class="mono" font-size="13" fill="#8E8E93">~ % iPad keyboard → HID inject → macOS IME</text>

    <text x="60" y="230" class="heading" font-size="84" font-weight="700" fill="white">你好</text>

    <!-- IME composition bar -->
    <rect x="60" y="260" width="320" height="36" rx="6" fill="#2c2c2e" stroke="#48484a" stroke-width="1"/>
    <text x="76" y="284" class="mono" font-size="16" fill="#FF9F0A">ㄋㄧˇ ㄏㄠˇ</text>
    <text x="200" y="284" class="heading" font-size="14" fill="#8E8E93">注音 (Zhuyin)</text>

    <!-- Status row -->
    <g transform="translate(60, 340)">
      <circle cx="8" cy="8" r="8" fill="#34C759"/>
      <text x="26" y="13" class="heading" font-size="15" font-weight="500" fill="white">Composition working natively</text>
    </g>

    <g transform="translate(60, 370)">
      <text x="0" y="0" class="heading" font-size="13" fill="#8E8E93">Every other VNC client breaks this.</text>
    </g>
  </g>
</svg>
